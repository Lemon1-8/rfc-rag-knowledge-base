<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">RFC RAG 知识库系统架构</title>
        <desc id="architecture-desc">横向三层架构图：客户端的浏览器与 React 前端访问 FastAPI，应用运行时包含 RAG 检索链和索引管道，右侧连接 TEI 模型服务、DeepSeek、Qdrant 和 SQLite。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --paper: #f5f5f5; --paper-2: #ececec;
      --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --rule: rgba(45,49,66,0.12); --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --sans: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --serif: 'Instrument Serif', 'Noto Serif SC', 'Microsoft YaHei', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #architecture-root { color: var(--ink); font-family: var(--sans); }
      #architecture-root .container { max-width: 1240px; margin: 0 auto; }
      #architecture-root .subtitle { color: var(--muted); font-size: 15px; line-height: 1.6; max-width: 680px; }
      #architecture-root .diagram { background: var(--paper-2); border: 1px solid var(--rule); border-radius: 8px; margin-top: 36px; overflow-x: auto; padding: 20px; }
      #architecture-root .note { border-top: 1px solid var(--rule); color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 20px; padding-top: 16px; }</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="1200" height="680" fill="#f5f5f5"/>

